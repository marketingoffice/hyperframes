<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Hands-Free Estimating with Alex</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Home Estimator — investor / GC demo (16:9). Navy ground, Inter, single gold accent. */
      :root {
        --navy: #1a1a2e;
        --card: #2d2d44;
        --line: #3a3a55;
        --gold: #d4af37;
        --gray: #a0aab2;
        --white: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy);
      }
      body {
        font-family: "Inter", sans-serif;
        color: var(--white);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy);
      }
      #bg {
        position: absolute;
        inset: 0;
        background: var(--navy);
      }

      /* ---------- opening ---------- */
      #intro {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      #intro-in {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #intro-logo {
        width: 360px;
        height: auto;
      }
      #intro-rule {
        width: 160px;
        height: 3px;
        background: var(--gold);
        margin: 46px 0 40px;
      }
      #intro-title {
        font-size: 64px;
        font-weight: 900;
        letter-spacing: -1.5px;
      }
      #intro-sub {
        margin-top: 18px;
        font-size: 30px;
        font-weight: 400;
        color: var(--gray);
      }

      /* ---------- demo layout: full-bleed app (16:9 crop of the 4:3 recording, framed per scene) ---------- */
      #demo {
        position: absolute;
        inset: 0;
      }
      #screen {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0e0e18;
      }
      #cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1438px;
      }
      #rec {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1438px;
        object-fit: fill;
      }

      /* ---------- opening hook ---------- */
      #hook {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 18px;
      }
      .hk,
      #hk3 {
        opacity: 0;
      }
      .hk {
        font-size: 118px;
        font-weight: 900;
        letter-spacing: -2.5px;
        line-height: 1.02;
      }
      #hk3 {
        margin-top: 26px;
        font-size: 56px;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: var(--gold);
      }
      /* ---------- chapter subtitles (bottom) ---------- */
      .cap {
        position: absolute;
        left: 44px;
        bottom: 40px;
        max-width: 860px;
        padding: 22px 30px 24px;
        border-radius: 14px;
        background: rgba(26, 26, 46, 0.94);
        border-left: 5px solid var(--gold);
        opacity: 0;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }
      .cap .k {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 4px;
        color: var(--gold);
      }
      .cap .t {
        margin-top: 8px;
        font-size: 38px;
        font-weight: 800;
        letter-spacing: -0.5px;
        line-height: 1.15;
      }
      .cap .t b {
        color: var(--gold);
      }
      .cap .n {
        margin-top: 8px;
        font-size: 17px;
        color: var(--gray);
      }
      /* ---------- highlight boxes (what the conversation is about) ---------- */
      .hl {
        position: absolute;
        border: 5px solid var(--gold);
        border-radius: 12px;
        box-shadow:
          0 0 0 4px rgba(26, 26, 46, 0.55),
          0 0 28px rgba(212, 175, 55, 0.65);
        opacity: 0;
      }
      /* ---------- on-screen name patches (Hasnain -> John) ---------- */
      .nm {
        position: absolute;
        white-space: nowrap;
        font-family: "Inter", sans-serif;
        display: flex;
        align-items: center;
        opacity: 0;
      }
      /* ---------- closing card (supplied design) ---------- */
      #outro {
        position: absolute;
        inset: 0;
        background: var(--card);
      }
      #outro-inner {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      #outro-logo {
        width: 560px;
        height: auto;
      }
      #outro-rule {
        width: 390px;
        height: 3px;
        background: var(--gold);
        margin: 98px 0 52px;
      }
      #outro-line {
        font-size: 40px;
        font-weight: 400;
      }
      #outro-cta {
        margin-top: 30px;
        font-size: 62px;
        font-weight: 700;
        color: var(--gold);
        letter-spacing: 0.5px;
      }
      #outro-url {
        margin-top: 30px;
        font-size: 38px;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="{{T}}"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="{{T}}" data-track-index="0"></div>

      <!-- pre-mixed audio: new presenter voiceover + Alex, level-matched; music only on the opening/closing cards -->
      <audio id="mix" src="assets/mix.m4a" data-start="0" data-duration="{{T}}" data-track-index="10" data-volume="1"></audio>

      <!-- OPENING 0–3 -->
      <!-- OPENING HOOK -->
      <section id="hook" class="clip" data-start="0" data-duration="{{HOOK_END}}" data-track-index="2">
        <div class="hk" id="hk1">No keyboard.</div>
        <div class="hk" id="hk2">No mouse.</div>
        <div id="hk3">Just a conversation with Alex.</div>
      </section>

      <section id="intro" class="clip" data-start="{{TITLE_START}}" data-duration="{{TITLE_DUR}}" data-track-index="1">
        <div id="intro-in">
          <img id="intro-logo" src="assets/logo.png" alt="Home Estimator" />
          <div id="intro-rule"></div>
          <div id="intro-title">Hands-Free Estimating with Alex</div>
          <div id="intro-sub">A full addition + remodel estimate, built by voice</div>
        </div>
      </section>

      <!-- DEMO -->
      <section id="demo">
        <div id="screen">
          <div id="cam" data-layout-allow-overflow>
            <video id="rec" class="clip" src="assets/recording.mp4" data-start="{{V}}" data-duration="{{N}}" data-track-index="3" muted playsinline></video>
{{NAMES}}
{{BOXES}}
          </div>
        </div>
{{CAPS}}
      </section>

      <!-- CLOSING CARD -->
      <section id="outro" class="clip" data-start="{{OUT}}" data-duration="8.5" data-track-index="1">
        <div id="outro-inner">
          <img id="outro-logo" src="assets/logo-end.png" alt="Home Estimator" />
          <div id="outro-rule"></div>
          <div id="outro-line">Try our hands-free mode</div>
          <div id="outro-cta">GO TO HOMEESTIMATOR.AI</div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const IN = "power3.out";
      const OUT = "power2.in";
      const V = {{V}}; // composition time where the recording starts (edit time 0)

      // ---------- opening ----------
      // hook: lines land on the spoken words
      tl.fromTo("#hk1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: IN }, {{HK1}});
      tl.fromTo("#hk2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: IN }, {{HK2}});
      tl.fromTo("#hk3", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, {{HK3}});
      tl.to("#hook", { opacity: 0, duration: 0.4, ease: OUT }, {{HOOK_OUT}});
      const T0 = {{TITLE_START}};
      tl.fromTo("#intro-logo", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.8, ease: IN }, T0 + 0.05);
      tl.fromTo("#intro-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: IN }, T0 + 0.45);
      tl.fromTo("#intro-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: IN }, T0 + 0.6);
      tl.fromTo("#intro-sub", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: IN }, T0 + 0.85);
      tl.to("#intro-in", { opacity: 0, duration: 0.35, ease: OUT }, V - 0.35);
      tl.set("#intro-in", { opacity: 0 }, V);

      // ---------- demo frame in (untimed layer: visibility owned by the timeline) ----------
      tl.set("#demo", { opacity: 0 }, 0);
      tl.set("#demo", { opacity: 1 }, V);
      tl.fromTo("#screen", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: IN }, V);
{{CAPS_JS}}
{{NAMES_JS}}

      // ---------- framing: no pans or zooms; the vertical crop only changes on a cut ----------
{{FRAMES_JS}}

      // ---------- highlight boxes ----------
{{BOXES_JS}}

      // ---------- out to closing card ----------
      tl.to("#demo", { opacity: 0, duration: 0.5, ease: OUT }, {{FADE}});
      tl.set("#demo", { opacity: 0 }, {{OUT}});

      // ---------- closing card ----------
      tl.fromTo("#outro-logo", { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.8, ease: IN }, {{O1}});
      tl.fromTo("#outro-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: IN }, {{O2}});
      tl.fromTo("#outro-line", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, {{O3}});
      tl.fromTo("#outro-cta", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, {{O4}});

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
